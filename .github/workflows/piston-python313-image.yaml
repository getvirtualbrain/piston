name: Publish Piston Python 3.13 image

on:
    push:
        branches:
            - master
            - main
            - v3
        paths:
            - api/**
            - packages/Makefile
            - packages/python/3.13.0/**
            - .github/workflows/piston-python313-image.yaml
    workflow_dispatch:
        inputs:
            image_tag:
                description: Extra tag to publish, for example python-3.13-prod
                required: false
                type: string

env:
    IMAGE_NAME: piston
    PYTHON_IMAGE_TAG: python-3.13

jobs:
    build_and_push:
        runs-on: ubuntu-latest
        environment: ${{ matrix.environment }}
        env:
            CONFIGURED_REGISTRY: ${{ vars.PISTON_IMAGE_REGISTRY }}
        strategy:
            fail-fast: false
            matrix:
                environment:
                    - staging
                    - production
        permissions:
            contents: read
            packages: write
            id-token: write
        steps:
            - name: Check out repo
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Configure AWS credentials
              if: vars.AWS_OIDC_ROLE != '' && vars.AWS_REGION != ''
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ vars.AWS_OIDC_ROLE }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Login to Amazon ECR
              if: vars.AWS_OIDC_ROLE != '' && vars.AWS_REGION != ''
              id: ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Login to GHCR
              if: vars.AWS_OIDC_ROLE == '' && (env.CONFIGURED_REGISTRY == '' || env.CONFIGURED_REGISTRY == 'ghcr.io')
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Login to private registry
              if: vars.AWS_OIDC_ROLE == '' && env.CONFIGURED_REGISTRY != '' && env.CONFIGURED_REGISTRY != 'ghcr.io'
              uses: docker/login-action@v3
              with:
                  registry: ${{ vars.PISTON_IMAGE_REGISTRY }}
                  username: ${{ vars.PISTON_IMAGE_REGISTRY_USERNAME }}
                  password: ${{ vars.PISTON_IMAGE_REGISTRY_PASSWORD }}

            - name: Compute image tags
              id: meta
              shell: bash
              env:
                  DEPLOY_ENV: ${{ matrix.environment }}
                  ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
                  CONFIGURED_REGISTRY: ${{ vars.PISTON_IMAGE_REGISTRY }}
                  CONFIGURED_IMAGE: ${{ vars.PISTON_IMAGE_NAME }}
                  MANUAL_IMAGE_TAG: ${{ inputs.image_tag }}
              run: |
                  set -euo pipefail

                  REGISTRY="${CONFIGURED_REGISTRY:-${ECR_REGISTRY:-ghcr.io}}"
                  IMAGE="${CONFIGURED_IMAGE:-${GITHUB_REPOSITORY}/api}"
                  REGISTRY="$(echo "${REGISTRY}" | tr '[:upper:]' '[:lower:]')"
                  IMAGE="$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')"

                  STABLE_TAG="${REGISTRY}/${IMAGE}:${PYTHON_IMAGE_TAG}-${DEPLOY_ENV}"
                  SHA_TAG="${REGISTRY}/${IMAGE}:${PYTHON_IMAGE_TAG}-${DEPLOY_ENV}-${GITHUB_SHA::12}"

                  {
                    echo "registry=${REGISTRY}"
                    echo "image=${IMAGE}"
                    echo "tags<<EOF"
                    echo "${STABLE_TAG}"
                    echo "${SHA_TAG}"
                    if [ -n "${MANUAL_IMAGE_TAG}" ]; then
                      echo "${REGISTRY}/${IMAGE}:${MANUAL_IMAGE_TAG}-${DEPLOY_ENV}"
                    fi
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: api/Dockerfile.python-3.13
                  platforms: linux/amd64
                  pull: true
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  cache-from: type=gha,scope=piston-python313
                  cache-to: type=gha,mode=max,ignore-error=true,scope=piston-python313

    # Pré-bake une AMI EC2 (Docker + image piston déjà pull + service systemd
    # déjà enable) pour éliminer le délai de boot (apt/docker pull) sur les
    # instances de l'ASG piston (cf. virtualbrain-terraform aws/environment/
    # {env}/ec2/piston.tf + data.tf). Ne construit jamais sur le tag flottant
    # python-3.13-<env> : recalcule le même tag SHA immuable que build_and_push
    # (PYTHON_IMAGE_TAG-DEPLOY_ENV-GITHUB_SHA12), garanti déjà poussé sur ECR
    # grâce à needs: build_and_push.
    bake_ami:
        needs: build_and_push
        runs-on: ubuntu-latest
        environment: ${{ matrix.environment }}
        strategy:
            fail-fast: false
            # Staging se bake automatiquement à chaque merge, comme le build
            # de l'image. Prod n'entre dans la matrice que sur déclenchement
            # manuel (workflow_dispatch) : cohérent avec virtualbrain-terraform,
            # où le tofu apply qui adopte la nouvelle AMI (rolling replace via
            # instance_refresh) est lui aussi toujours manuel. (job-level `if`
            # n'a pas accès au contexte matrix, d'où ce filtrage ici plutôt
            # qu'un `if: matrix.environment == ...`.)
            matrix:
                environment: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["staging","production"]') || fromJSON('["staging"]') }}
        env:
            # Terraform (aws/environment/prod/ec2) nomme son environnement
            # "prod", pas "production" comme l'environnement GitHub : c'est
            # cette valeur qui devient le tag Environment lu par le data
            # "aws_ami" Terraform, donc pas de faute de frappe ici.
            PACKER_ENVIRONMENT: ${{ matrix.environment == 'production' && 'prod' || 'staging' }}
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Check out repo
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ vars.AWS_OIDC_ROLE }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Login to Amazon ECR
              id: ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Compute immutable image tag
              id: meta
              env:
                  DEPLOY_ENV: ${{ matrix.environment }}
              run: |
                  set -euo pipefail
                  echo "image_tag=${PYTHON_IMAGE_TAG}-${DEPLOY_ENV}-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

            # Requis par ssh_interface = "session_manager" dans le template
            # Packer : l'instance de build tourne dans un subnet privé sans IP
            # publique, Packer s'y connecte via un tunnel SSM plutôt que SSH
            # exposé publiquement.
            - name: Install session-manager-plugin
              run: |
                  curl -fsSL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/session-manager-plugin.deb
                  sudo dpkg -i /tmp/session-manager-plugin.deb

            - name: Setup Packer
              uses: hashicorp/setup-packer@v3
              with:
                  version: "1.16.0"

            - name: Packer init
              working-directory: packer/piston
              run: packer init .

            - name: Bake AMI
              working-directory: packer/piston
              run: |
                  set -euo pipefail
                  packer build \
                    -var-file="${PACKER_ENVIRONMENT}.pkrvars.hcl" \
                    -var "image_tag=${{ steps.meta.outputs.image_tag }}" \
                    -var "ecr_registry=${{ steps.ecr.outputs.registry }}" \
                    -var "subnet_id=${{ vars.PACKER_BUILDER_SUBNET_ID }}" \
                    -var "security_group_id=${{ vars.PACKER_BUILDER_SECURITY_GROUP_ID }}" \
                    .
